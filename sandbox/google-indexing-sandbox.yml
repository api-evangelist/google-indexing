prerequisites_before_any_call:
  steps:
    - Create a Google Cloud project and enable the Indexing API.
    - Create a service account and download its JSON private key.
    - Verify the site in Search Console.
    - Add the service account email as a delegated site owner on that property.
  source: https://developers.google.com/search/apis/indexing-api/v3/prereqs
  note: >-
    This four-step gate is the practical barrier to trying the API. There is no way to make a successful
    call without completing all four — an unauthenticated call returns 401, and an authenticated call
    against an unverified property returns 403 "Failed to verify the URL ownership."
