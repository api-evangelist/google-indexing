note: >-
  The Indexing API has NO test mode and NO sandbox environment. There are no test keys, no magic test
  URLs, and no fixture values — every call goes to production Google Search and consumes real daily
  quota. What Google does publish is an interactive, authenticated console (the APIs Explorer) and a
  token-minting playground. Both are recorded below because they are the only "try it" surfaces that
  exist. No test value is invented here because Google publishes none.
test_mode:
  available: false
  key_prefixes: null
  modes: []
  note: >-
    There is no test-vs-live distinction. Submitting a URL_UPDATED notification is a production request
    against Google Search and counts against the 200/day publish quota. The only way to exercise the API
    without side effects is getMetadata, which is read-only — and it can only query URLs previously seen
    in a successful notification from the same project.
