  - name: OAuth 2.0 Playground
    type: token-minting-console
    url: https://developers.google.com/oauthplayground/
    status: 200
    probed: '2026-08-13'
    auth: Google sign-in
    executes_real_requests: true
    note: >-
      Exchanges an authorization code for an access token against any Google scope, including
