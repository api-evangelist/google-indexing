              service: indexing.googleapis.com
api_specific_errors:
  source: https://developers.google.com/search/apis/indexing-api/v3/core-errors
  note: In every case below the request is rejected and Google does not crawl the URL.
  errors:
    - status: 400
      message: Missing attribute. 'url' attribute is required.
      cause: The URL was not set in the request body.
      remediation: Set the required `url` field on the UrlNotification body.
    - status: 400
      message: Invalid attribute. 'url' is not in standard URL format
      cause: A value that is not a URL was supplied.
      remediation: Send a fully-qualified absolute URL.
    - status: 400
      message: Unknown type. 'type' attribute is required and must be 'URL_REMOVED' or 'URL_UPDATED'.
      cause: The notification type was not set.
      remediation: Set `type` to URL_UPDATED or URL_DELETED.
    - status: 400
      message: Invalid value at 'url_notification.type' (TYPE_ENUM)
      cause: The notification type was set to a value outside the enum.
      remediation: Use only the documented enum values.
    - status: 403
      message: Permission denied. Failed to verify the URL ownership.
      cause: >-
        The calling service account has not completed Search Console ownership verification for the
        property, or is submitting a URL outside a verified property.
      remediation: >-
        Verify the site in Search Console and add the service account email as a delegated owner. See
        https://developers.google.com/search/apis/indexing-api/v3/prereqs
