note: >-
  The Indexing API does NOT use RFC 9457 application/problem+json. It uses the standard Google API error
  envelope (google.rpc.Status) returned as application/json. The envelope shape below was captured from a
  live unauthenticated probe on 2026-08-13, not transcribed from docs. The reason-code registry is
  Google's published global error domain plus the Indexing-API-specific messages.
