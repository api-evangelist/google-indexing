      type: integer
      description: HTTP status code.
    - name: error.message
      type: string
      description: Human-readable description, often carrying a docs link.
    - name: error.status
      type: string
      description: Canonical google.rpc.Code name, e.g. UNAUTHENTICATED, PERMISSION_DENIED.
    - name: error.details[]
      type: array
      description: Typed detail objects, e.g. type.googleapis.com/google.rpc.ErrorInfo.
    - name: error.details[].reason
      type: string
      description: Machine-readable reason code, e.g. CREDENTIALS_MISSING.
    - name: error.details[].domain
      type: string
      description: Error domain, googleapis.com for global errors.
    - name: error.details[].metadata
      type: object
      description: Service and method that produced the error.
  observed_example:
    probed: '2026-08-13'
    request: GET https://indexing.googleapis.com/v3/urlNotifications/metadata?url=https%3A%2F%2Fexample.com
