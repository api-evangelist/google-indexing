aid: google-indexing
name: Google Indexing
description: >-
  The Google Indexing API lets a site owner tell Google directly when a page has been added, updated, or removed,
  instead of waiting for a crawl. It is a two-operation API — publish a URL notification, and read back the latest
  notification metadata for a URL. Google restricts its use to pages carrying JobPosting structured data, or
  BroadcastEvent embedded in a VideoObject. It is free of charge, capped by default at 200 publish requests per day
  per Google Cloud project, and gated on Search Console ownership verification rather than on price.
accessModel:
  pricing: free
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Free · Self-serve signup, eligibility-gated
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-08-13'
  method: searched
  note: >-
    Corrected from `freemium` on 2026-08-13. Google's quota and pricing page states "All use of the Indexing API is
    available without payment." There are no paid tiers. The real gate is content eligibility plus Search Console
    delegated site ownership, not a paywall.
