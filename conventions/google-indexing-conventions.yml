    Google states all calls to /v3/urlNotifications:publish MUST send Content-Type: application/json.
idempotency:
  supported: false
  header: null
  key_scope: null
  retention: null
  note: >-
    No idempotency key mechanism exists. There is no Idempotency-Key header and no request-id echo. The
    publish operation is, however, naturally repeatable: re-submitting the same {url, type} pair is a
    supported flow ("If the page's contents change, submit another update notification"), and each
    submission consumes daily quota. Retrying a failed publish is therefore safe for correctness but not
    free — a retry loop burns the 200/day publish quota. No `Idempotency` pointer is wired in apis.yml
    because the provider ships no idempotency mechanism.
pagination:
  supported: false
  note: >-
    Neither operation returns a collection. getMetadata returns a single UrlNotificationMetadata for one
    URL; publish returns a single object. There is no pageToken, cursor or limit parameter anywhere in
    the Discovery Document.
