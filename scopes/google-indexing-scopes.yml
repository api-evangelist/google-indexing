granularity:
  scope_count: 1
  read_only_scope: false
  least_privilege_possible: false
  note: >-
    A single scope covers both the read operation and the production write. An agent that only needs to
    look up notification metadata must be granted the same scope that lets it change what Google
    crawls. This is a real least-privilege gap in the provider's design, not a gap in this artifact.
authorization_beyond_scope:
  required: true
  mechanism: Search Console delegated site ownership, enforced per URL
