method: searched
source: https://indexing.googleapis.com/$discovery/rest?version=v3
docs: https://developers.google.com/search/apis/indexing-api/v3/prereqs
note: >-
  Upgraded from derived to searched on 2026-08-13. The scope string and its description were read from
