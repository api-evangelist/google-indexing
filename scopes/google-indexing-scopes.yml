scopes:
  - scope: https://www.googleapis.com/auth/indexing
    description: Submit data to Google for indexing
    sensitivity: restricted
    grants:
      - publishUrlNotification
      - getUrlNotificationMetadata
    flows:
      - jwt-bearer
      - authorizationCode
    sources:
      - openapi/_original/google-indexing-discovery-v3.json
